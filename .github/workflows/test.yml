name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: CKAN ${{ matrix.ckan-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ckan-version: "2.10"
            ckan-image: "ckan/ckan-dev:2.10-py3.10"
            solr-image: "ckan/ckan-solr:2.10-solr9"
          - ckan-version: "2.11"
            ckan-image: "ckan/ckan-dev:2.11-py3.10"
            solr-image: "ckan/ckan-solr:2.11-solr9"

    container:
      image: ${{ matrix.ckan-image }}
      options: --user root

    services:
      solr:
        image: ${{ matrix.solr-image }}
      postgres:
        image: ckan/ckan-postgres-dev:${{ matrix.ckan-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7

    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1

    steps:
      - uses: actions/checkout@v4

      - name: Install extension and test dependencies
        run: |
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
          pip install -e .

      - name: Configure CKAN test environment
        run: |
          sed -i -e 's|use = config:.*|use = config:/srv/app/src/ckan/test-core.ini|' test.ini
          ckan -c test.ini db init

      - name: Run tests
        run: >-
          pytest --ckan-ini=test.ini
          --cov=ckanext.dcatapcrc
          --disable-warnings
          ckanext/dcatapcrc
